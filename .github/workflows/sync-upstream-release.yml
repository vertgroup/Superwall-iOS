name: Propose latest upstream release

on:
  schedule:
    - cron: "31 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

env:
  MAINTENANCE_BRANCH: vert-renewal-entitlements
  MARKER_FILE: .vert/upstream-release
  UPSTREAM_REPOSITORY: superwall/Superwall-iOS

jobs:
  propose-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.MAINTENANCE_BRANCH }}
          token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}

      - id: sync
        name: Create upstream release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail

          latest_release="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq '.tag_name')"
          current_release="$(tr -d '[:space:]' < "${MARKER_FILE}")"
          echo "release=${latest_release}" >> "${GITHUB_OUTPUT}"

          if [[ "${latest_release}" == "${current_release}" ]]; then
            echo "status=up_to_date" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          safe_release="$(printf '%s' "${latest_release}" | tr -c '[:alnum:]._-' '-')"
          update_branch="automation/upstream-${safe_release}"
          existing_pr="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${update_branch}" \
            --state open \
            --json url \
            --jq '.[0].url // empty')"

          if [[ -n "${existing_pr}" ]]; then
            echo "status=existing_pr" >> "${GITHUB_OUTPUT}"
            echo "url=${existing_pr}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --force upstream "refs/tags/${latest_release}:refs/tags/${latest_release}"
          git switch -c "${update_branch}"

          set +e
          git merge --no-ff --no-commit "${latest_release}"
          merge_status=$?
          set -e

          if [[ ${merge_status} -ne 0 ]]; then
            git merge --abort
            issue_url="$(gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Manual merge needed for upstream ${latest_release}" \
              --body "The scheduled upstream-release merge conflicted with Vert's entitlement patch. Rebase \`${MAINTENANCE_BRANCH}\` onto upstream tag \`${latest_release}\` manually." \
              2>/dev/null || true)"
            echo "status=conflict" >> "${GITHUB_OUTPUT}"
            echo "url=${issue_url}" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

          printf '%s\n' "${latest_release}" > "${MARKER_FILE}"
          git add "${MARKER_FILE}"
          git commit -m "Merge upstream release ${latest_release}"
          git push origin "${update_branch}"

          pr_url="$(gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${MAINTENANCE_BRANCH}" \
            --head "${update_branch}" \
            --title "Update to upstream ${latest_release}" \
            --body "$(cat <<EOF
          ## Summary
          - merge upstream release \`${latest_release}\`
          - preserve Vert's external renewal-metadata changes

          ## Test plan
          - [ ] review upstream release notes
          - [ ] run this fork's build and tests
          - [ ] verify external entitlement metadata remains in customer info
          - [ ] update Haven's pinned SuperwallKit commit
          EOF
          )")"

          echo "status=new_pr" >> "${GITHUB_OUTPUT}"
          echo "url=${pr_url}" >> "${GITHUB_OUTPUT}"

      - name: Notify Slack
        if: always()
        env:
          RELEASE: ${{ steps.sync.outputs.release }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ steps.sync.outputs.status }}
          URL: ${{ steps.sync.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SLACK_WEBHOOK_URL}" ]] || [[ "${STATUS}" != "new_pr" && "${STATUS}" != "conflict" ]]; then
            exit 0
          fi

          if [[ "${STATUS}" == "new_pr" ]]; then
            message="New ${GITHUB_REPOSITORY} upstream-release PR for ${RELEASE}: ${URL}"
          else
            message="${GITHUB_REPOSITORY} needs a manual merge for upstream ${RELEASE}: ${URL}"
          fi

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "${message}" '{text: $text}')" \
            "${SLACK_WEBHOOK_URL}"
